name: CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Typecheck
        run: mypy src

      - name: Test
        run: pytest -q
