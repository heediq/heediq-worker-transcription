name: Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile.free'
      - 'Dockerfile.paid'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

# AWS_REGION and deploy role ARNs are resolved from GitHub organization-level
# Actions variables (D-070, D-071) — not hardcoded per repo.
env:
  ECR_REPO: 313828097088.dkr.ecr.eu-west-1.amazonaws.com/heediq-worker-transcription

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Typecheck
        run: mypy src

      - name: Test
        run: pytest -q

  build-and-push:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha-tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Push-only role, scoped to heediq-* ECR repos in the shared-services account (D-045).
      # Distinct from GitHubActionsDeployRole, which is per-workload-account and used below to
      # register task-definition revisions and update Pipes — pushing an image never needs
      # access to a workload account.
      - name: Configure AWS credentials (shared-services)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REPO }}

      - uses: docker/setup-buildx-action@v3

      # Free tier — whisper small only, no gated model, no build secret needed.
      # ECR registry cache (mode=max) so pip-install and model-weight layers are reused
      # across runs. Images are multi-GB so GHA cache (10 GB repo limit) would be evicted
      # immediately by the paid image; ECR has no practical size limit (~$0.10/GB/month).
      - name: Build & push free image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.free
          push: true
          tags: |
            ${{ env.ECR_REPO }}:free-${{ steps.sha.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REPO }}:cache-free
          cache-to: type=registry,ref=${{ env.ECR_REPO }}:cache-free,mode=max

      # Paid tier — bakes the gated pyannote/speaker-diarization-3.1 pipeline at build time.
      # HF_TOKEN is mounted as a BuildKit secret (not an ENV/ARG) so it never persists in any
      # image layer or appears in this log.
      - name: Build & push paid image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.paid
          push: true
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ${{ env.ECR_REPO }}:paid-${{ steps.sha.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REPO }}:cache-paid
          cache-to: type=registry,ref=${{ env.ECR_REPO }}:cache-paid,mode=max

  promote-dev:
    name: Promote → dev
    needs: build-and-push
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote free & paid tiers
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha-tag }}
        run: ./scripts/promote-transcription-worker.sh "$SHA_TAG"

  promote-staging:
    name: Promote → staging
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote free & paid tiers
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha-tag }}
        run: ./scripts/promote-transcription-worker.sh "$SHA_TAG"

  promote-prod:
    name: Promote → prod
    needs: [build-and-push, promote-staging]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote free & paid tiers
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha-tag }}
        run: ./scripts/promote-transcription-worker.sh "$SHA_TAG"
