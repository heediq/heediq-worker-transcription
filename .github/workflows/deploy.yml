name: Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'Dockerfile.free'
      - 'Dockerfile.paid'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

# AWS_REGION and deploy role ARNs are resolved from GitHub organization-level
# Actions variables (D-070, D-071) — not hardcoded per repo.
env:
  ECR_REPO: 313828097088.dkr.ecr.eu-west-1.amazonaws.com/heediq-worker-transcription

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Typecheck
        run: mypy src

      - name: Test
        run: pytest -q

  build-and-push:
    name: Build & push ${{ matrix.tier }} image
    needs: test
    runs-on: ubuntu-latest
    # A stalled build fails fast with retrievable logs instead of burning GitHub's 6h default. A
    # registry-cache export once stalled and ran the full 6 hours, and the cancelled job left NO
    # usable log — this ceiling turns that into a clean, debuggable failure.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    strategy:
      # The two images are independent — a stall or failure in one tier must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - tier: free # whisper small only — no gated model, no build secret
            dockerfile: Dockerfile.free
          - tier: paid # whisper large-v3 + gated pyannote — needs the HF_TOKEN build secret
            dockerfile: Dockerfile.paid
    env:
      # Line-based, complete, grep-able build logs (a cancelled TTY-progress build left us blind).
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Push-only role, scoped to heediq-* ECR repos in the shared-services account (D-045).
      # Distinct from GitHubActionsDeployRole, which is per-workload-account and used by the promote
      # jobs to register task-definition revisions — pushing an image never needs workload-account
      # access.
      - name: Configure AWS credentials (shared-services)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        run: aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REPO }}

      - uses: docker/setup-buildx-action@v3

      # Per-tier ECR registry cache (mode=max) so the pip-install and model-weight layers are reused
      # across runs. Images are multi-GB, so GHA cache (10 GB repo limit) would thrash; ECR has no
      # practical size limit (~$0.10/GB/month). The base image is digest-pinned in the Dockerfiles,
      # so an upstream mutable-tag repush can't silently bust the whole cache.
      - name: Build & push ${{ matrix.tier }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # provenance/sbom default to true on v6 and push extra attestation manifests that ECR's
          # untagged-image lifecycle rule can't clean up (still index-referenced by the tag) — D-108,
          # the main driver of unbounded ECR storage growth.
          provenance: false
          sbom: false
          # Only the paid image bakes the gated pyannote/speaker-diarization-3.1 pipeline; its
          # HF_TOKEN is mounted as a BuildKit secret (never an ENV/ARG, so it never persists in a
          # layer or appears in the log). The free build never receives the token.
          secrets: ${{ matrix.tier == 'paid' && format('hf_token={0}', secrets.HF_TOKEN) || '' }}
          tags: ${{ env.ECR_REPO }}:${{ matrix.tier }}-${{ steps.sha.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REPO }}:cache-${{ matrix.tier }}
          cache-to: type=registry,ref=${{ env.ECR_REPO }}:cache-${{ matrix.tier }},mode=max

  promote-dev:
    name: Promote → dev
    needs: build-and-push
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      # The sha-tag is derived from the commit, not threaded through a job output — the build is now
      # a matrix (per-tier) and matrix jobs can't cleanly expose a single scalar output.
      - name: Promote free & paid tiers
        run: ./scripts/promote-transcription-worker.sh "sha-${GITHUB_SHA::7}"

  promote-staging:
    name: Promote → staging
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote free & paid tiers
        run: ./scripts/promote-transcription-worker.sh "sha-${GITHUB_SHA::7}"

  promote-prod:
    name: Promote → prod
    needs: [build-and-push, promote-staging]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote free & paid tiers
        run: ./scripts/promote-transcription-worker.sh "sha-${GITHUB_SHA::7}"
